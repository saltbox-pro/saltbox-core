[project]
dynamic = [ 'dependencies' ]
name = 'fastms-core'
version = '0.0.0'
requires-python = '>=3.9'
license = { 'text' = 'N/A' }  # FIXME
description = ''
readme = 'README.md'

[project.optional-dependencies]
dev = [
    'Flake8-pyproject',
    'flake8',
    'flake8-logging',
    'ipython',
    'mypy',
    'pre-commit',
    'pylint',
    'types-redis',
    'python-lsp-server[all]',
]

[project.scripts]

[metadata]
url = 'https://gitlab/fastms'

[build-system]
requires = ['setuptools', 'setuptools-scm']
build-backend = 'setuptools.build_meta'

[tool.setuptools.package-dir]
'fastms_core.backend' = './backend/'

[tool.setuptools.dynamic]
dependencies = { file = ['backend/requirements.txt'] }

[tool.flake8]
max-line-length = 120
extend-ignore = [ ]
builtins = '__opts__'

[tool.mypy]
check_untyped_defs = true
