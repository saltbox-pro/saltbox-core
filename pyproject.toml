[project]
dynamic = [ 'dependencies', 'version' ]
name = 'fastms-core'
requires-python = '>=3.9'
license = { 'text' = 'N/A' }  # FIXME
description = ''
readme = 'README.md'
classifiers = [
  'Topic :: System :: Systems Administration',
]

[project.optional-dependencies]
dev = [
    'Flake8-pyproject',
    'flake8',
    'flake8-logging',
    'ipython',
    'mypy',
    'pre-commit',
    'pylint',
    'types-redis',
    'python-lsp-server[all]',
]

[project.scripts]

[metadata]
url = 'https://gitlab.com/fastms'
version = 'attr: package.__version__'

[build-system]
requires = ['setuptools>=57.4.0', 'setuptools-scm']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
# Explicit package dir for flat-layout
include = ['fastms_core']

[tool.setuptools.dynamic]
dependencies = { file = ['requirements.txt'] }
version = { attr = 'fastms_core.__version__' }

[tool.flake8]
max-line-length = 120
extend-ignore = [ ]
builtins = [ '__opts__', '__salt__' ]

[tool.mypy]
check_untyped_defs = true
plugins = [ 'pydantic.mypy' ]
