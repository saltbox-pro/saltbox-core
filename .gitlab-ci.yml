---

stages:
  - lint
  - test
  - build

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'


Build core image for tag:
  stage: build
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build core image for branch:
  stage: build
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'

ruff:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    pip3 install -e .[dev]
  script:
    ruff check salt_box_core # --select I --fix
  cache:
    paths:
      - '.cache/pip/'

mypy:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    pip3 install -e .[dev]
  script:
    mypy salt_box_core
  cache:
    paths:
      - '.cache/pip/'

pytest:
  stage: test
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - pip3 install -e .[dev]
  script:
    pytest
  coverage: '/^TOTAL.+?(\d+\%)$/'
  cache:
    paths:
      - '.cache/pip/'
