---

stages:
  - lint
  - test
  - build
  - generate-scheme
  - generate-api-client
  - deploy

variables:
  # Set 0 to disable linting jobs
  LINTING_ENABLED: true

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'


Build core image for tag:
  stage: build
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build core image for branch:
  stage: build
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


.lint-job:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - apk add git
    - pip3 install -e .[dev]
  cache:
    paths:
      - '.cache/pip/'
  rules:
    - if: $LINTING_ENABLED == 'true'


Ruff:
  extends: .lint-job
  script: ruff check saltbox_core


Mypy:
  extends: .lint-job
  script: mypy saltbox_core


pytest:
  stage: test
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
    APK_CACHE_DIR: '$CI_PROJECT_DIR/.cache/apk'
    SALTBOX_ENV_FILE: 'tests/test.env'
  image: python:3.12-alpine
  before_script:
    - mkdir --parents "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" git
    - pip3 install -e .[dev]
  script:
    - pytest
  coverage: '/^TOTAL.+?(\d+\%)$/'
  cache:
    paths:
      - '$PIP_CACHE_DIR'
      - '$APK_CACHE_DIR'

openapi-scheme-generate:
  stage: generate-scheme
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
    APK_CACHE_DIR: '$CI_PROJECT_DIR/.cache/apk'
    SALTBOX_ENV_FILE: 'tests/test.env'
  image: python:3.12-alpine
  before_script:
    - mkdir --parents "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" git
    - pip3 install -e .[dev]
  script:
    - VERSION=$(python3 -c 'import saltbox_core; print(saltbox_core.__version__)')
    - echo "PYTHON_VERSION=$VERSION" > build.env
    - python ./saltbox_core/utilities/generate_openapi.py
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - openapi.json
    expire_in: 1 day
  cache:
    paths:
      - '$PIP_CACHE_DIR'
      - '$APK_CACHE_DIR'


.api-client-generate:
  image:  openapitools/openapi-generator-cli:v7.14.0
  stage: generate-api-client
  dependencies:
    - openapi-scheme-generate
  artifacts:
    untracked: true
    expire_in: 1 day
  script:
    - bash /usr/local/bin/docker-entrypoint.sh generate
      --config ./openapi-generator-config.json
      --additional-properties=npmName=@saltbox/${CI_PROJECT_NAME}-api-client
      --additional-properties=npmVersion=${VERSION}

release-api-client-generate:
  extends: .api-client-generate
  variables:
    VERSION: "${PYTHON_VERSION}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-?/

nightly-api-client-generate:
  extends: .api-client-generate
  variables:
    VERSION: "${PYTHON_VERSION}-${CI_COMMIT_SHA}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-?/
      when: never
    - when: on_success

.api-client-deploy:
  image:  node:22.18.0
  variables:
    GIT_STRATEGY: none
  stage: deploy
  script:
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}">.npmrc
    - npm install
    - npm config set @saltbox:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - npm publish
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never

release-api-client-deploy:
  extends: .api-client-deploy
  dependencies:
    - release-api-client-generate
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-?/

nightly-api-client-deploy:
  extends: .api-client-deploy
  dependencies:
    - nightly-api-client-generate
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-?/
      when: never
    - when: on_success
