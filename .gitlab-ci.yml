---

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != 'merge_request_event'

stages:
  - lint
  - test
  - build

variables:
  # Set 0 to disable linting jobs
  LINTING_ENABLED: true

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'


.lint-job:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - apk add git
    - pip3 install -e .[dev]
  cache:
    paths:
      - '.cache/pip/'
  rules:
    - if: $LINTING_ENABLED == 'true'


Ruff:
  extends: .lint-job
  script: ruff check saltbox_core


Mypy:
  extends: .lint-job
  script: mypy saltbox_core


Pytest:
  stage: test
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
    APK_CACHE_DIR: '$CI_PROJECT_DIR/.cache/apk'
    SALTBOX_ENV_FILE: 'tests/test.env'
  image: python:3.12-alpine
  before_script:
    - mkdir --parents "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" git
    - pip3 install -e .[dev]
  script:
    - pytest
  coverage: '/^TOTAL.+?(\d+\%)$/'
  cache:
    paths:
      - '$PIP_CACHE_DIR'
      - '$APK_CACHE_DIR'


Build core image for tag:
  stage: build
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build core image for branch:
  stage: build
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Trigger API Client pipeline:
  stage: build
  variables:
    MODULE_NAME: saltbox_core
    SALTBOX_ENV_FILE: 'tests/test.env'
  trigger:
    include: 
      - project: 'saltbox/ci-lib'
        file: 'gen-api-client.yml'
    strategy: mirror
