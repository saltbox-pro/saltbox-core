---

include:
  - project: 'salt.box/ci-lib'
    file: 'build-image.yml'


Build core image for tag:
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build core image for branch:
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Build autotests image for tag:
  extends: .build-image
  variables:
    CONTEXT_PATH: autotests/
    ADDITIONAL_PATH: autotests
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build autotests image for branch:
  extends: .build-image
  variables:
    CONTEXT_PATH: autotests/
    ADDITIONAL_PATH: autotests
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Flake8:
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    pip3 install -e .[dev]
  script:
    flake8 fastms_core
  cache:
    paths:
      - '.cache/pip/'
