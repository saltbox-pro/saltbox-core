---

include:
  - project: 'fastms/ci-lib'
    file: 'build-image.yml'


Build image for tag:
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build image for branch:
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'


Flake8:
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    pip3 install -e .[dev]
  script:
    flake8 fastms_core
  cache:
    paths:
      - '.cache/pip/'
