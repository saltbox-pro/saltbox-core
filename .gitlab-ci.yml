---

# Change to make non-empty commit and trigger push event
# rel: 0

stages:
  - .guard
  - lint
  - test
  - bump-version
  - build

variables:
  # Set 0 to disable linting jobs
  LINTING_ENABLED: true
  # Set 0 to disable testing job
  TESTING_ENABLED: true
  BASE_IMAGE: 'registry.altlinux.org/alt/alt:p11'
  PYTHON: python3.12.13  # SHOULD match the BASE_IMAGE python3 package

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'

  - project: 'saltbox/ci-lib'
    file: 'def-branch-merge-guard.yml'

  - project: 'saltbox/ci-lib'
    file: 'set-version.yml'


.python-base:
  variables:
    APK_CACHE_DIR: '${CI_PROJECT_DIR}/.cache/apk'
    UV_CACHE_DIR: '${CI_PROJECT_DIR}/.cache/uv'
  image: alpine:latest
  before_script:
    - mkdir --parents "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" git uv
    - uv sync --python="$PYTHON" --dev --no-sources
    - source .venv/bin/activate
  cache:
    paths:
      - '$APK_CACHE_DIR'
      - '$UV_CACHE_DIR'


Ruff:
  stage: lint
  extends: .python-base
  script: ruff check saltbox_core
  rules:
    - if: $LINTING_ENABLED == 'true'


Mypy:
  stage: lint
  extends: .python-base
  script: mypy saltbox_core
  rules:
    - if: $LINTING_ENABLED == 'true'


Pytest:
  stage: test
  extends: .python-base
  variables:
    SALTBOX_ENV_FILE: 'tests/test.env'
  script:
    - pytest
  coverage: '/^TOTAL.+?(\d+\%)$/'
  rules:
    - if: $TESTING_ENABLED == 'true'


Bump Core version:
  stage: bump-version
  extends: .set-backend-version
  variables:
    INNER_VERSION_FILE: 'saltbox_core/__init__.py'


Build Core image:
  stage: build
  extends: .build-image
  variables:
    TARGET: prod
    EXTRA_ARGS: "--build-arg='BASE_IMAGE=$BASE_IMAGE'"


Trigger API Client pipeline:
  stage: build
  variables:
    MODULE_NAME: saltbox_core
    SALTBOX_ENV_FILE: 'tests/test.env'
  trigger:
    include:
      - project: 'saltbox/ci-lib'
        file: 'gen-api-client.yml'
    strategy: mirror
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push'


